<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Брони</title>
<link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Inter-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/Inter-Regular.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/Inter-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/Inter-ExtraBold.woff2") format("woff2")}
/* Вёрстка как в «Фартук · Смена». Цвета: серый акцент (оттенки серого), тема светлая/тёмная по настройке телефона.
   Все цвета только здесь, по имени. Другой акцент — поменять --accent, --accent-ink, --accent-soft, --bar. */
:root{
  /* светлая тема — как на скрине 1: светло-серый фон, белые карточки с мягкой тенью, оранжево-красный акцент, чёрная панель */
  --bg:#ecebf2; --card:rgba(255,255,255,.58); --field:rgba(255,255,255,.55); --line:rgba(100,100,130,.16);
  --text:#101113; --text-2:#4a4d55; --hint:#80838c;
  --accent:#e8481c; --accent-ink:#d33e12; --accent-soft:rgba(232,72,28,.12); --on-color:#ffffff; --bar:#f06a3a;
  --dark:#151515; --seg-ink:#ffffff;
  --grad:#e8481c; --glow:rgba(232,72,28,.25);
  --fab:#e8481c; --fab-ink:#ffffff;   /* круглая кнопка «+» */
  --ok:#1f9d55; --ok-soft:rgba(31,157,85,.14); --warn:#c77d00; --warn-soft:rgba(199,125,0,.16); --err:#d9382c; --err-soft:rgba(217,56,44,.12);
  --scrim:rgba(20,20,35,.30); --shadow:rgba(0,0,0,.06); --shadow-strong:rgba(20,20,40,.26);
  --sheet:rgba(255,255,255,.80); --glass-border:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,.9); --glass-border-nav:rgba(255,255,255,.06);
  --glass-shadow:0 10px 30px rgba(70,70,110,.12);
  --nav-bg:rgba(21,21,21,.80); --nav-ink:#f4f4f6; --nav-btn:rgba(255,255,255,.12);
  --bad:#c8205a; --bad-soft:rgba(214,40,90,.14); --tile:rgba(20,20,40,.06); --tile-border:rgba(20,20,40,.20);
  --hero-a:rgba(255,205,180,.85); --hero-b:rgba(255,150,100,.60);
  --blob1:rgba(255,150,110,.38); --blob2:rgba(160,160,255,.32); --blob3:rgba(255,190,160,.32);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  /* тёмная тема: тёмно-коричневый фон и оранжевое свечение (скрин 3) */
  --bg:#110d0b; --card:rgba(78,62,54,.38); --field:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --text:#f6efe9; --text-2:#c9bcb2; --hint:#a39489;
  --accent:#ff7a2e; --accent-ink:#ffa05a; --accent-soft:rgba(255,122,46,.22); --on-color:#ffffff; --bar:#ff9a3d;
  --dark:#f6efe9; --seg-ink:#1a110c;
  --grad:#ff6a2e; --glow:rgba(255,106,46,.30);
  --fab:#ff6a2e; --fab-ink:#ffffff;
  --ok:#4cc27f; --ok-soft:rgba(76,194,127,.18); --warn:#e8a73a; --warn-soft:rgba(232,167,58,.18); --err:#ff6b5e; --err-soft:rgba(255,107,94,.18);
  --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.3); --shadow-strong:rgba(0,0,0,.55);
  --sheet:rgba(34,26,22,.80); --glass-border:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.13); --glass-border-nav:rgba(255,255,255,.14);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45);
  --nav-bg:rgba(44,34,29,.72); --nav-ink:#f6efe9; --nav-btn:rgba(255,255,255,.10);
  --bad:#ff7aa6; --bad-soft:rgba(255,90,140,.24); --tile:rgba(255,255,255,.14); --tile-border:rgba(255,255,255,.28);
  --hero-a:rgba(255,150,50,.30); --hero-b:rgba(210,60,20,.30);
  --blob1:rgba(255,140,30,.28); --blob2:rgba(215,80,20,.22); --blob3:rgba(255,120,40,.17);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
b,strong{font-weight:600}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:14px 14px 120px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(55% 35% at 10% 6%,var(--blob1),transparent 70%),
  radial-gradient(50% 38% at 95% 28%,var(--blob2),transparent 70%),
  radial-gradient(70% 45% at 20% 96%,var(--blob3),transparent 70%),
  radial-gradient(45% 30% at 92% 86%,var(--blob1),transparent 70%)}
header{padding:2px 12px 14px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--hint);font-size:12px;margin-top:2px}
.banner{background:var(--err-soft);color:var(--err);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:18px;padding:11px 14px;margin-bottom:10px;font-size:14px}
.sec{font-size:18px;font-weight:800;margin:20px 12px 8px}
.note{color:var(--hint);font-size:14px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--glass-border);border-radius:24px;padding:14px;margin-bottom:12px;box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.loading-note{text-align:center;color:var(--hint);padding:30px 0}
.empty{text-align:center;color:var(--hint);padding:40px 0}
.ver{text-align:center;color:var(--hint);font-size:12px;margin-top:20px}

/* нижняя панель: тёмная таблетка, выбранная вкладка с подписью */
.navpill{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:4px;padding:7px;border-radius:24px;background:var(--nav-bg);border:1px solid var(--glass-border-nav);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 8px 24px var(--shadow-strong),inset 0 1px 0 rgba(255,255,255,.14)}
.seg-btn{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;min-width:48px;padding:0 13px;border:0;border-radius:17px;color:var(--nav-ink);font-size:14px;font-weight:600;background:var(--nav-btn)}
.seg-btn svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg-btn span{display:none}
.seg-btn[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 14px var(--glow),inset 0 1px 0 rgba(255,255,255,.4)}
.seg-btn[aria-pressed="true"] span{display:inline}

/* кнопки */
button{font:inherit;transition:opacity .15s ease-out}
button:not(.btn):not(:disabled):active{opacity:.6;transition:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;background:var(--grad);color:#fff;box-shadow:0 6px 18px var(--glow),inset 0 1px 0 rgba(255,255,255,.4);font-weight:600;transition:transform .08s,opacity .08s}
.btn:active{transform:scale(.97);opacity:.85}
.btn-light{background:var(--field);color:var(--accent-ink);margin-top:8px;box-shadow:inset 0 1px 0 var(--glass-hi);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn-del{background:var(--field);color:var(--err);margin-top:8px;box-shadow:inset 0 1px 0 var(--glass-hi);border:1px solid var(--glass-border)}
.btn.pending{opacity:.8}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:62px;height:62px;border-radius:22px;border:0;background:var(--fab);color:var(--fab-ink);font-size:34px;line-height:1;font-weight:400;padding:0 0 3px;box-shadow:0 8px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .08s}
.fab:active{transform:scale(.93);opacity:1}

/* карточка брони */
.day-h{margin:16px 12px 6px;font-size:13px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.03em}
.day-h.today{color:var(--accent-ink)}
.bk{cursor:pointer}
.bk .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bk .who{display:flex;align-items:center;gap:12px;min-width:0}
.bk .whotxt{min-width:0}
.bk .whotxt .name,.bk .whotxt .time{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .time{font-weight:600;font-size:14px;color:var(--text-2)}
.bk .total{font-weight:600}
.bk .name{margin-top:0;color:var(--text);font-weight:600;font-size:17px}
.bk .meta{color:var(--hint);font-size:12px;margin-top:2px}
.bk .meta.nt{color:var(--text-2);font-size:14px}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mark{border:1px solid var(--glass-border);border-radius:14px;padding:12px 8px;font-weight:600;font-size:15px;background:var(--field);box-shadow:inset 0 1px 0 var(--glass-hi);color:var(--err)}
.mark.ok{color:var(--ok)}
.acts{display:flex;gap:8px;margin-top:8px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--glass-border);background:var(--field);box-shadow:inset 0 1px 0 var(--glass-hi);border-radius:14px;padding:12px 4px;font-size:14px;font-weight:600;color:var(--accent-ink)}

/* нажатие: класс .pressed ставится сразу при касании (в том числе во время прокрутки), :active на телефоне для этого не годится */
button,.acts a,.bk{transition:transform .2s ease-out,opacity .2s ease-out}
.pressed{transform:scale(.95)!important;opacity:.6!important;transition:transform .06s ease-out,opacity .06s ease-out!important}
.cell.pressed{transform:scale(.86)!important}
.bk.pressed{transform:scale(.985)!important;opacity:.75!important}
.acts a{display:block}
.info-note{white-space:pre-wrap;word-break:break-word}

/* календарь: два месяца, как на втором скрине — тёмно-красные карточки, цифры без рамок, сегодня — белый круг */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.cal-nav b{font-size:14px;font-weight:400;color:var(--text-2)}
.cal-nav button{border:1px solid var(--glass-border);background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--glass-shadow);width:44px;height:44px;border-radius:14px;font-size:22px;color:var(--text)}
.mon{padding:20px 14px 14px;border-radius:28px}
.mon-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.mon-h b{font-size:32px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.mon-h span{font-size:20px;font-weight:600;color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.dow{font-size:14px;font-weight:600;color:var(--hint);text-align:center;padding:8px 0 10px}
.cell{width:42px;height:42px;justify-self:center;border:1px solid transparent;border-radius:13px;background:transparent;position:relative;font-weight:600;font-size:17px;color:var(--text);padding:0}
.cell.out{visibility:hidden}
.cell.past{color:var(--hint);font-weight:400}
.cell.has{background:var(--accent-soft);color:var(--accent-ink);font-weight:800;border-color:var(--accent-soft)}
.cell.has.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.cell.has.pastb{background:rgba(125,125,135,.26);color:var(--text-2);font-weight:600;border-color:rgba(125,125,135,.22)}
.cell.has.pastb.bad{color:var(--bad);border-color:var(--bad-soft)}
.cell.today{border-color:var(--tile-border);box-shadow:0 3px 12px var(--shadow-strong),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cell.today:not(.has){background:var(--tile);font-weight:800}
.legend{color:var(--hint);font-size:12px;margin:2px 12px}

/* выручка */
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:4px 0 8px}
.presets::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;border:1px solid var(--glass-border);border-radius:14px;padding:10px 16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:var(--card);color:var(--text);font-size:15px}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--glow)}
.range-row{display:flex;align-items:center;gap:8px}
.range-row span{color:var(--hint)}
.range-row input{flex:1;min-width:0;text-align:center}
.hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b))}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.cmp{font-size:14px;font-weight:600}
.cmp.up{color:var(--ok)} .cmp.down{color:var(--err)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.kv small{display:block;color:var(--hint);font-size:12px}
.kv b{font-weight:600}
.kv.tap{cursor:pointer}
.bad-row{color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:2px;margin:6px 0 2px}
.bar{flex:1;background:var(--grad);border-radius:6px 6px 0 0;min-height:2px;opacity:.85}
.bar.zero{background:var(--field)}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.bcol .bar{flex:none;transition:opacity .15s}
.bars.picked .bcol .bar{opacity:.4}
.bars.picked .bcol.on .bar{opacity:1}
.bval{font-size:10px;line-height:1;text-align:center;white-space:nowrap;margin-bottom:3px;color:var(--text-2)}
.bval.vert{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;margin:0 auto 3px}
.bdates{display:flex;gap:2px}
.bdates span{flex:1;min-width:0;text-align:center;font-size:10px;line-height:1.25;color:var(--hint)}
.bars-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--hint)}
.bsel{text-align:center;font-size:14px;font-weight:600;min-height:18px}
.bsel.tip{font-size:12px;font-weight:400;color:var(--hint)}
.day{border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day.hl{background:var(--accent-soft);border-radius:14px;margin:0 -8px;padding:0 8px;border-top-color:transparent}
.day-detail{font-size:14px;color:var(--text-2);padding:0 0 8px}
.day-detail div{padding:2px 0}

/* окно снизу */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:none;align-items:flex-end;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet-bg.on{display:flex}
.sheet{background:var(--sheet);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border-top:1px solid var(--glass-border);box-shadow:0 -10px 40px var(--shadow-strong);width:100%;border-radius:30px 30px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;overflow-x:hidden}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:800}
.sheet .card{background:var(--field);border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
input,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--glass-border);border-radius:14px;padding:9px 10px;outline:none;width:100%;min-width:0;max-width:100%;min-height:44px;-webkit-appearance:none;appearance:none;text-align:left;display:block;caret-color:var(--accent-ink);transform:translateZ(0)}
input::placeholder,textarea::placeholder{color:var(--hint)}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input:focus,textarea:focus{border-color:var(--accent-ink)}
textarea{min-height:150px;resize:vertical;border-radius:10px}
textarea.small{min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.two>div,.three>div{min-width:0}
.pv{border-top:1px solid var(--line);padding:10px 0}
.pv:first-child{border:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;margin-right:6px}
.tag.new{background:var(--ok-soft);color:var(--ok)}
.tag.upd{background:var(--warn-soft);color:var(--warn)}
.tag.same{background:var(--field);color:var(--hint)}
.center{text-align:center;padding:60px 24px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--nav-bg);color:#fff;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-border-nav);padding:11px 18px;border-radius:16px;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1>Брони</h1>
    <div class="sub">Дабл Дак <span id="sync"></span></div>
  </div>
</header>
<div id="banner"></div>
<nav class="navpill" id="tabs">
  <button class="seg-btn" data-t="list" aria-pressed="true" aria-label="Список"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Список</span></button>
  <button class="seg-btn" data-t="cal" aria-pressed="false" aria-label="Календарь"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Календарь</span></button>
  <button class="seg-btn" data-t="rev" aria-pressed="false" aria-label="Выручка"><svg viewBox="0 0 24 24"><path d="M6 20V12M12 20V5M18 20v-5"/></svg><span>Выручка</span></button>
</nav>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Добавить бронь">+</button>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ НАСТРОЙКИ ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyKlFP3dOh51GF1FZ4gvpCaoGXEorNJs1FAU87ynrZCC7SzcC5yYHToD-d7s3xvQZ5orw/exec';   // ссылка на веб-приложение Apps Script (оканчивается на /exec)
const APP_VERSION = '2026-11-16.6';
/* ===================================== */

const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
}
const initData = tg ? tg.initData : '';
const apiReady = !API_URL.startsWith('PASTE');
let uid = 'x';
try { uid = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'x'); } catch (e) {}
const CACHE_KEY = 'broni-cache-v2-' + uid;   // свой кэш у каждого пользователя
let loaded = false;        // true, когда есть данные (из кэша или с сервера)
let serverVersion = '';
let lastFetch = 0;

let bookings = [];
let tab = 'list';
let showPast = false;
let calStart = new Date(); calStart.setDate(1);
let dayOpen = null;
let revPreset = 'month';
let revFrom = '', revTo = '';
let denied = null;
let pending = 0, mut = 0;   // pending — сколько сохранений в пути, mut — счётчик правок (чтобы старый ответ не затирал свежую правку)

/* ---------- утилиты ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoAdd = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const fmt = n => Math.round(Number(n) || 0).toLocaleString('ru-RU').replace(/ /g, ' ');
const money = n => fmt(n) + ' ₽';
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WEEKDAYS = ['вс','пн','вт','ср','чт','пт','сб'];
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayIso = () => iso(new Date());
const dmy = s => { const p = s.split('-'); return p[2] + '.' + p[1]; };
const dmyFull = s => { const p = s.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; };
const weekday = s => WEEKDAYS[parseIso(s).getDay()];
const mondayIso = s => isoAdd(s, -((parseIso(s).getDay() + 6) % 7));
const pl = (n, a, b, c) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; };

function haptic(kind) {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (kind === 'select') tg.HapticFeedback.selectionChanged();
    else if (kind === 'success' || kind === 'error' || kind === 'warning') tg.HapticFeedback.notificationOccurred(kind);
    else tg.HapticFeedback.impactOccurred(kind || 'light');
  } catch (e) {}
}

function dayLabel(s) {
  const d = parseIso(s), t = parseIso(todayIso());
  const diff = Math.round((d - t) / 864e5);
  const base = DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_G[d.getMonth()];
  return diff === 0 ? 'Сегодня · ' + base : diff === 1 ? 'Завтра · ' + base : base;
}
function fmtPhone(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (d.length === 11) return `+${d[0]} ${d.slice(1, 4)} ${d.slice(4, 7)}-${d.slice(7, 9)}-${d.slice(9)}`;
  return p || '';
}
function timeRange(b) {
  if (!b.from) return 'время не указано';
  const night = b.to && b.to <= b.from;
  return b.from + '–' + (b.to || '?') + (night ? ' (до утра)' : '');
}
const total = b => (b.rent || 0) + (b.cleaning || 0) + (b.bartender || 0);
const sorted = arr => arr.slice().sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400);
}
function confirmBox(msg, cb) {
  if (tg && tg.showConfirm) { try { return tg.showConfirm(msg, cb); } catch (e) {} }
  cb(window.confirm(msg));
}

/* ---------- разбор текста из чата ---------- */
/*PARSER_START*/
function parseBookings(text, todayStr) {
  const today = todayStr ? new Date(todayStr + 'T00:00:00') : new Date();
  const lines = String(text).replace(/ /g, ' ').replace(/[️​]/g, '').split(/\r?\n/).map(s => s.trim());
  const blocks = []; let cur = null;
  for (const l of lines) {
    const m = l.match(/^(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?$/);
    if (m) { cur = { d: +m[1], mo: +m[2], y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : 0, lines: [] }; blocks.push(cur); }
    else if (cur && l) cur.lines.push(l);
  }
  const num = s => +String(s).replace(/\D/g, '') || 0;
  const out = [];
  for (const b of blocks) {
    let y = b.y;
    if (!y) {
      y = today.getFullYear();
      if (new Date(y, b.mo - 1, b.d) < new Date(today.getTime() - 60 * 864e5)) y++;
    }
    const r = { id: '', date: y + '-' + pad(b.mo) + '-' + pad(b.d), from: '', to: '', rent: 0, cleaning: 0, bartender: 0,
      name: '', phone: '', depositPaid: false, depositSum: 0, contract: false, note: '' };
    const notes = []; let moneyDone = false;
    for (const l of b.lines) {
      let m;
      if ((m = l.match(/(\d{1,2})[:.](\d{2})\s*(?:до|-|–|—)\s*(\d{1,2})[:.](\d{2})/i))) {
        r.from = pad(+m[1]) + ':' + m[2]; r.to = pad(+m[3]) + ':' + m[4];
      } else if (/^залог/i.test(l)) {
        r.depositPaid = l.includes('✅');
        const a = l.replace(/\*.*$/, '').match(/\d[\d'’ ]*\d|\d/);
        if (a) r.depositSum = num(a[0]);
        const n = l.match(/\*\s*(.+)$/); if (n) notes.push(n[1].trim());
      } else if (/^договор/i.test(l)) {
        r.contract = l.includes('✅');
        const n = l.match(/\*\s*(.+)$/); if (n) notes.push(n[1].trim());
      } else if (!moneyDone && (/убор|бармен|руб/i.test(l) || /^\d{1,7}(?:['’ ]\d{3})*\s*(\+|$)/.test(l))) {
        moneyDone = true;
        for (const part of l.split('+')) {
          const nm = part.match(/\d[\d'’ ]*/); if (!nm) continue;
          const v = num(nm[0]);
          if (/убор/i.test(part)) r.cleaning += v;
          else if (/бармен/i.test(part)) r.bartender += v;
          else r.rent += v;
        }
      } else if (!r.phone && /(\+?\d[\d\s\-()]{8,}\d)/.test(l)) {
        const pm = l.match(/(\+?\d[\d\s\-()]{8,}\d)/);
        let d = pm[1].replace(/\D/g, '');
        if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
        if (d.length === 10) d = '7' + d;
        r.phone = d;
        r.name = l.replace(pm[1], '').replace(/[,:;–—-]+\s*$/, '').trim();
      } else {
        notes.push(l);
      }
    }
    r.note = notes.join('; ');
    out.push(r);
  }
  return out;
}
/*PARSER_END*/

/* ---------- данные ---------- */
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && Array.isArray(c.list)) { bookings = c.list; serverVersion = c.sv || ''; loaded = true; }
  } catch (e) {}
}
function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ list: bookings, sv: serverVersion, t: Date.now() })); } catch (e) {}
}

async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ initData }, body)) });
  return handle(await res.json());
}
function handle(j) {
  if (!j.ok) {
    if (j.denied) { denied = j.userId; render(); }
    throw new Error(j.error || 'Ошибка сервера');
  }
  return j;
}
function applyServer(list, sv) { bookings = list; loaded = true; if (sv) serverVersion = sv; saveCache(); renderAll(); }

async function refresh(silent) {
  if (!apiReady) return;
  const m = mut;
  lastFetch = Date.now();
  setSync(true);
  try {
    const res = await fetch(`${API_URL}?action=list&initData=${encodeURIComponent(initData)}`);
    const j = handle(await res.json());
    if (m !== mut || pending > 0) return;   // за время загрузки что-то поменяли — старый ответ не применяем
    denied = null;
    $('banner').innerHTML = '';
    applyServer(j.bookings, j.version);
  } catch (e) {
    if (!silent || !loaded) $('banner').innerHTML = `<div class="banner">${esc(e.message)}. Показаны сохранённые данные.</div>`;
  } finally { setSync(false); }
}
function setSync(on) { const el = $('sync'); if (el) el.textContent = on ? 'обновляю…' : ''; }

async function commit(changed, removedId) {
  mut++; pending++;
  if (removedId) bookings = bookings.filter(b => b.id !== removedId);
  for (const c of changed || []) {
    const i = bookings.findIndex(b => b.id === c.id);
    if (i >= 0) bookings[i] = c; else bookings.push(c);
  }
  saveCache(); renderAll();
  if (!apiReady) { pending--; return toast('Демо: сохранено только на этом телефоне'); }
  try {
    const j = removedId ? await api({ action: 'delete', id: removedId }) : await api({ action: 'save', bookings: changed });
    pending--;
    if (pending === 0) applyServer(j.bookings, j.version);
    toast('Сохранено');
  } catch (e) {
    pending--;
    haptic('error');
    toast('Не сохранилось: ' + e.message);
    if (pending === 0) refresh(true);
  }
}

/* ---------- карточка брони ---------- */
function card(b) {
  const tel = String(b.phone || '').replace(/\D/g, '');
  return `<div class="card bk" data-info="${esc(b.id)}">
    <div class="top"><div class="who"><div class="whotxt"><div class="name">${esc(b.name || 'Без имени')}</div><div class="time">${esc(timeRange(b))}</div></div></div><span class="total">${money(total(b))}</span></div>
    <div class="meta">${money(b.rent)} аренда${b.cleaning ? ' + ' + money(b.cleaning) + ' уборка' : ''}${b.bartender ? ' + ' + money(b.bartender) + ' бармен' : ''}</div>
    ${b.note ? `<div class="meta nt">${esc(b.note)}</div>` : ''}
    <div class="marks">
      <button class="mark ${b.depositPaid ? 'ok' : ''}" data-tog="depositPaid" data-id="${esc(b.id)}">Залог ${b.depositPaid ? '✓' : '✗'}</button>
      <button class="mark ${b.contract ? 'ok' : ''}" data-tog="contract" data-id="${esc(b.id)}">Договор ${b.contract ? '✓' : '✗'}</button>
    </div>
    <div class="acts">
      ${tel ? `<a href="tel:+${tel}" data-tel="${tel}">Позвонить</a><a href="https://wa.me/${tel}" data-wa="${tel}">WhatsApp</a>` : ''}
      <button data-edit="${esc(b.id)}">Изменить</button>
    </div>
  </div>`;
}

function copyText(s) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).catch(() => {}); return; } } catch (e) {}
  try { const ta = document.createElement('textarea'); ta.value = s; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } catch (e) {}
}
// Телеграм на некоторых телефонах не открывает tel: — тогда копируем номер и говорим об этом
function callPhone(tel) {
  const num = '+' + tel;
  let left = false;
  const mark = () => { left = true; };
  window.addEventListener('blur', mark, { once: true });
  document.addEventListener('visibilitychange', mark, { once: true });
  try { window.location.href = 'tel:' + num; } catch (e) {}
  setTimeout(() => {
    window.removeEventListener('blur', mark); document.removeEventListener('visibilitychange', mark);
    if (left) return;
    copyText(num);
    toast('Номер ' + fmtPhone(tel) + ' скопирован — вставьте его в звонилку');
  }, 1200);
}
function openWa(tel) {
  const url = 'https://wa.me/' + tel;
  try { if (tg && tg.openLink) return tg.openLink(url); } catch (e) {}
  window.open(url, '_blank');
}

function askToggle(id, key) {
  const b = bookings.find(x => x.id === id); if (!b) return;
  const on = !b[key];
  const q = key === 'depositPaid'
    ? (on ? 'Отметить: залог получен?' : 'Снять отметку «залог получен»?')
    : (on ? 'Отметить: договор подписан?' : 'Снять отметку «договор подписан»?');
  const d = parseIso(b.date);
  confirmBox(`${q}\n${b.name || 'Без имени'}, ${d.getDate()} ${MONTHS_G[d.getMonth()]}`, ok => {
    if (!ok) return;
    haptic('success');
    commit([Object.assign({}, b, { [key]: on })]);
  });
}

/* ---------- отрисовка ---------- */
function renderAll() {
  render();
  if (dayOpen) renderDaySheet();
}

function render() {
  const v = $('view');
  $('fab').hidden = !!denied;
  $('tabs').hidden = !!denied;
  if (denied) {
    v.innerHTML = `<div class="center"><h2>Нет доступа</h2><p class="note">Отправьте этот номер тому, кто настраивает приложение:</p><p style="font-size:26px;font-weight:800;margin:8px 0">${esc(denied)}</p></div>`;
    return;
  }
  if (!apiReady) $('banner').innerHTML = '<div class="banner">Демо-режим: приложение ещё не подключено к таблице, данные хранятся только на этом телефоне.</div>';
  if (!loaded && apiReady) { v.innerHTML = '<div class="loading-note">Загружаю брони…</div>'; return; }
  v.innerHTML = tab === 'list' ? renderList() : tab === 'cal' ? renderCal() : renderRev();
  v.insertAdjacentHTML('beforeend', `<div class="ver">версия ${APP_VERSION}${serverVersion ? ' · сервер ' + serverVersion : ''}</div>`);
  if (tab === 'rev') bindRev();
}

function renderList() {
  const t = todayIso();
  const up = sorted(bookings.filter(b => b.date >= t));
  const past = sorted(bookings.filter(b => b.date < t)).reverse();
  let h = '';
  if (!up.length) h += '<div class="empty">Ближайших броней нет</div>';
  let last = '';
  for (const b of up) {
    if (b.date !== last) { last = b.date; h += `<div class="day-h ${b.date === t ? 'today' : ''}">${dayLabel(b.date)}</div>`; }
    h += card(b);
  }
  if (past.length) {
    h += `<button class="btn btn-light" id="pastBtn">${showPast ? 'Скрыть прошедшие' : 'Показать прошедшие (' + past.length + ')'}</button>`;
    if (showPast) { last = ''; for (const b of past) { if (b.date !== last) { last = b.date; h += `<div class="day-h">${dayLabel(b.date)}</div>`; } h += card(b); } }
  }
  return h;
}

/* календарь: сразу два месяца */
function monthHtml(y, m) {
  const first = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const t = todayIso();
  let h = `<div class="card mon"><div class="mon-h"><b>${MONTHS[m]}</b><span>${String(y).slice(2)}</span></div><div class="grid">`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => h += `<div class="dow">${d}</div>`);
  for (let i = 0; i < first; i++) h += '<div class="cell out"></div>';
  for (let d = 1; d <= days; d++) {
    const s = y + '-' + pad(m + 1) + '-' + pad(d);
    const bs = bookings.filter(b => b.date === s);
    const bad = bs.some(b => !b.depositPaid || !b.contract);
    h += `<button class="cell ${bs.length ? 'has' : ''} ${bs.length && bad ? 'bad' : ''} ${s === t ? 'today' : ''} ${s < t && !bs.length ? 'past' : ''} ${s < t && bs.length ? 'pastb' : ''}" data-day="${s}">${d}</button>`;
  }
  return h + '</div></div>';
}
function renderCal() {
  const a = new Date(calStart), b = new Date(a.getFullYear(), a.getMonth() + 1, 1);
  const cap = x => x[0].toUpperCase() + x.slice(1);
  const title = a.getFullYear() === b.getFullYear()
    ? `${cap(MONTHS[a.getMonth()])} – ${cap(MONTHS[b.getMonth()])} ${a.getFullYear()}`
    : `${cap(MONTHS[a.getMonth()])} ${a.getFullYear()} – ${cap(MONTHS[b.getMonth()])} ${b.getFullYear()}`;
  return `<div class="cal-nav"><button id="cPrev" aria-label="Назад">‹</button><b>${title}</b><button id="cNext" aria-label="Вперёд">›</button></div>`
    + monthHtml(a.getFullYear(), a.getMonth()) + monthHtml(b.getFullYear(), b.getMonth())
    + '<div class="legend">Окошко — сегодня, оранжевая клетка — бронь, серая — прошедшая, розовая — не получен залог или нет договора. Нажмите на день, чтобы открыть.</div>';
}

/* ---------- выручка (как в «Фартук · Смена») ---------- */
const PRESETS = [['week', 'Эта неделя'], ['month', 'Этот месяц'], ['lastmonth', 'Прошлый месяц'],
  ['nextmonth', 'Следующий месяц'], ['year', 'Этот год'], ['custom', 'Свой период']];

function presetRange(p) {
  const t = todayIso(), now = parseIso(t), y = now.getFullYear(), m = now.getMonth();
  const mr = (yy, mm) => [iso(new Date(yy, mm, 1)), iso(new Date(yy, mm + 1, 0))];
  if (p === 'week') { const mo = mondayIso(t); return [mo, isoAdd(mo, 6)]; }
  if (p === 'month') return mr(y, m);
  if (p === 'lastmonth') return mr(y, m - 1);
  if (p === 'nextmonth') return mr(y, m + 1);
  if (p === 'year') return [y + '-01-01', y + '-12-31'];
  return [revFrom || t, revTo || t];
}
function daysBetween(a, b) { return Math.round((parseIso(b) - parseIso(a)) / 864e5) + 1; }

function calc(from, to) {
  const list = bookings.filter(b => b.date >= from && b.date <= to);
  const sum = k => list.reduce((a, b) => a + (b[k] || 0), 0);
  const o = { from, to, days: daysBetween(from, to), list, n: list.length,
    rent: sum('rent'), cleaning: sum('cleaning'), bartender: sum('bartender') };
  o.rev = o.rent + o.cleaning + o.bartender;
  return o;
}

function renderRev() {
  const [f, t] = presetRange(revPreset);
  let h = '<div class="presets" id="revPresets">' + PRESETS.map(([id, label]) =>
    `<button class="chip" data-p="${id}" aria-pressed="${id === revPreset}">${label}</button>`).join('') + '</div>';
  if (revPreset === 'custom') {
    h += `<div class="card"><div class="range-row"><span>С</span><input type="date" id="revFrom" value="${f}"><span>по</span><input type="date" id="revTo" value="${t}"></div></div>`;
  }
  const d = calc(f, t);
  const prevTo = isoAdd(f, -1), prevFrom = isoAdd(prevTo, -(d.days - 1));
  const prev = calc(prevFrom, prevTo);
  h += `<div class="sub" style="margin:2px 12px 8px">${f === t ? dmyFull(f) : dmyFull(f) + ' – ' + dmyFull(t)}</div>`;

  h += `<div class="card hero"><div class="note" style="margin-top:0">Выручка по броням</div><div class="big">${money(d.rev)}</div>`;
  if (prev.rev > 0) {
    const pct = Math.round((d.rev - prev.rev) / prev.rev * 100);
    h += `<div class="cmp ${pct > 0 ? 'up' : pct < 0 ? 'down' : ''}">${pct > 0 ? '+' : pct < 0 ? '−' : ''}${Math.abs(pct)}% к прошлому периоду</div>
      <div class="note">${dmy(prev.from)}–${dmy(prev.to)}: ${money(prev.rev)}</div>`;
  }
  h += `<div class="note">${d.n ? `${d.n} ${pl(d.n, 'бронь', 'брони', 'броней')} · в среднем ${money(d.rev / d.n)} за бронь` : 'Броней за этот период нет'}</div></div>`;
  if (!d.n) return h;

  const paid = d.list.filter(b => b.depositPaid), noDep = d.list.filter(b => !b.depositPaid), noCon = d.list.filter(b => !b.contract);
  const depSum = paid.reduce((a, b) => a + (b.depositSum || 0), 0);
  const kv = (l, v, s) => `<div class="kv"><div>${l}${s ? `<small>${s}</small>` : ''}</div><div><b>${v}</b></div></div>`;
  h += `<div class="card">${kv('Аренда', money(d.rent))}${kv('Уборка', money(d.cleaning))}${kv('Бармен', money(d.bartender))}
    ${kv('Залоги получены', `${paid.length} из ${d.n}`, depSum ? 'на ' + money(depSum) : '')}
    ${kv('Договоры подписаны', `${d.n - noCon.length} из ${d.n}`)}</div>`;

  const att = (title, arr) => arr.length ? `<h2 class="sec">${title}</h2><div class="card">${sorted(arr).map(b =>
    `<div class="kv bad-row tap" data-edit="${esc(b.id)}"><div>${weekday(b.date)} ${dmy(b.date)}<small>${esc(b.name || 'Без имени')}</small></div><div><b>${esc(fmtPhone(b.phone))}</b></div></div>`).join('')}</div>` : '';
  h += att('Нет залога', noDep) + att('Нет договора', noCon);

  // По дням: столбики и список
  h += '<h2 class="sec">По дням</h2><div class="card" id="revDays">';
  const perDay = {};
  d.list.forEach(b => { perDay[b.date] = (perDay[b.date] || 0) + total(b); });
  if (d.days > 1) {
    const monthly = d.days > 62;
    const BAR_H = 90;
    const keys = [];
    if (monthly) { const s = parseIso(f); for (let i = 0; i < 12 * 3; i++) { const dt = new Date(s.getFullYear(), s.getMonth() + i, 1); if (iso(dt) > t) break; keys.push(dt); } }
    const vals = monthly ? keys.map(dt => d.list.filter(b => b.date.startsWith(dt.getFullYear() + '-' + pad(dt.getMonth() + 1))).reduce((a, b) => a + total(b), 0))
      : Array.from({ length: d.days }, (_, i) => perDay[isoAdd(f, i)] || 0);
    const max = Math.max(1, ...vals);
    const full = !monthly && d.days <= 7, short = !monthly && !full && d.days <= 31;
    const sm = v => v >= 1000 ? Math.round(v / 1000) + 'к' : String(Math.round(v));
    h += '<div class="bsel tip" id="bsel">Нажмите на столбик, чтобы увидеть день</div><div class="bars" id="bars"' + (monthly ? ' data-monthly="1"' : '') + '>';
    vals.forEach((v, i) => {
      const key = monthly ? iso(keys[i]) : isoAdd(f, i);
      h += `<div class="bcol" data-bar="${key}" data-v="${v}">${v && (full || short || monthly) ? `<div class="bval${short ? ' vert' : ''}">${sm(v)}</div>` : ''}<div class="bar${v ? '' : ' zero'}" style="height:${Math.max(2, Math.round(v / max * BAR_H))}px"></div></div>`;
    });
    h += '</div>';
    if (monthly) h += '<div class="bdates">' + keys.map(dt => `<span>${MONTHS_S[dt.getMonth()]}</span>`).join('') + '</div>';
    else if (full) h += '<div class="bdates">' + vals.map((_, i) => { const s = isoAdd(f, i); return `<span>${weekday(s)}<br>${dmy(s)}</span>`; }).join('') + '</div>';
    else h += `<div class="bars-axis"><span>${dmy(f)}</span><span>${dmy(t)}</span></div>`;
  }
  const byDay = {};
  d.list.forEach(b => { (byDay[b.date] = byDay[b.date] || []).push(b); });
  Object.keys(byDay).sort().forEach(s => {
    const list = byDay[s];
    h += `<div class="day" data-dayrow="${s}"><div class="kv tap" data-detail="${s}"><div>${weekday(s)} ${dmy(s)}<small>${esc(list.map(b => b.name || 'Без имени').join(', '))}</small></div><div><b>${money(list.reduce((a, b) => a + total(b), 0))}</b></div></div>
      <div class="day-detail" id="dd-${s}" hidden>${list.map(b => `<div>${esc(timeRange(b))} · аренда ${money(b.rent)}${b.cleaning ? ' · уборка ' + money(b.cleaning) : ''}${b.bartender ? ' · бармен ' + money(b.bartender) : ''}<br>залог ${b.depositPaid ? '✓' : '✗'} · договор ${b.contract ? '✓' : '✗'}</div>`).join('')}</div></div>`;
  });
  return h + '</div>';
}

function bindRev() {
  const rf = $('revFrom'), rt = $('revTo');
  if (rf && rt) {
    const go = () => { if (rf.value && rt.value) { revFrom = rf.value <= rt.value ? rf.value : rt.value; revTo = rf.value <= rt.value ? rt.value : rf.value; render(); } };
    rf.addEventListener('change', go); rt.addEventListener('change', go);
  }
}
function pickBar(key, v) {
  const bars = $('bars'); if (!bars) return;
  bars.classList.add('picked');
  bars.querySelectorAll('.bcol').forEach(c => c.classList.toggle('on', c.dataset.bar === key));
  const sel = $('bsel'); sel.classList.remove('tip');
  const dt = parseIso(key);
  const label = bars.dataset.monthly ? `${MONTHS[dt.getMonth()]} ${dt.getFullYear()}` : `${weekday(key)} ${dmy(key)}`;
  sel.textContent = `${label} — ${Number(v) ? money(v) : 'нет броней'}`;
  document.querySelectorAll('#revDays .day').forEach(r => r.classList.toggle('hl', r.dataset.dayrow === key));
  const row = document.querySelector(`[data-dayrow="${key}"]`);
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------- окна снизу ---------- */
function openSheet(html) { $('sheet').innerHTML = html; $('bg').classList.add('on'); }
function closeSheet() { $('bg').classList.remove('on'); dayOpen = null; }

function openDay(s) { dayOpen = s; renderDaySheet(); $('bg').classList.add('on'); $('sheet').scrollTop = 0; }
function renderDaySheet() {
  const bs = sorted(bookings.filter(b => b.date === dayOpen));
  $('sheet').innerHTML = `<h2>${dayLabel(dayOpen)}</h2>`
    + (bs.length ? bs.map(card).join('') + `<button class="btn btn-light" data-add="${dayOpen}">Добавить ещё бронь на эту дату</button>`
      : `<p class="note">Свободно</p><button class="btn" data-add="${dayOpen}">Добавить бронь на эту дату</button>`)
    + '<button class="btn btn-light" data-close="1">Закрыть</button>';
}

function addMenu(date) {
  dayOpen = null;
  openSheet(`<h2>Новая бронь</h2>
    <button class="btn" id="mPaste" style="margin-top:12px">Вставить текст из чата</button>
    <button class="btn btn-light" id="mManual">Заполнить вручную</button>
    <button class="btn btn-light" id="mClose">Отмена</button>`);
  $('mPaste').onclick = pasteSheet;
  $('mManual').onclick = () => editSheet(null, date);
  $('mClose').onclick = closeSheet;
}

function pasteSheet() {
  openSheet(`<h2>Вставьте текст из чата</h2>
    <div class="note">Можно сразу весь список или одну бронь.</div>
    <textarea id="pText" placeholder="14.11&#10;С 17:00 до 22:00&#10;22'500 + 2'000 уборка&#10;Наталья +7 965 063-18-38&#10;Залог 10 000 ✅&#10;Договор ✅"></textarea>
    <button class="btn" id="pGo" style="margin-top:12px">Разобрать</button>
    <button class="btn btn-light" id="pBack">Назад</button>`);
  $('pBack').onclick = () => addMenu();
  $('pGo').onclick = () => {
    const found = parseBookings($('pText').value);
    if (!found.length) { haptic('error'); return toast('Не нашёл ни одной брони. Нужна строка с датой, например 14.11'); }
    previewSheet(found);
  };
}

const FIELDS = ['from','to','rent','cleaning','bartender','name','phone','depositPaid','depositSum','contract','note'];
function previewSheet(found) {
  const items = found.map(f => {
    const ex = bookings.find(b => b.date === f.date && b.from === f.from);
    if (!ex) return { b: f, kind: 'new' };
    const merged = Object.assign({}, f, { id: ex.id });
    return { b: merged, kind: FIELDS.every(k => String(ex[k]) === String(merged[k])) ? 'same' : 'upd' };
  });
  const todo = items.filter(i => i.kind !== 'same');
  openSheet(`<h2>Найдено броней: ${items.length}</h2>
    <div class="card" style="margin-top:10px">${items.map(i => `<div class="pv">
      <span class="tag ${i.kind}">${i.kind === 'new' ? 'новая' : i.kind === 'upd' ? 'обновить' : 'уже есть'}</span><b>${dayLabel(i.b.date)}</b>
      <div class="meta nt">${esc(timeRange(i.b))} · ${money(total(i.b))} · ${esc(i.b.name || 'без имени')}</div>
      <div class="meta">Залог ${i.b.depositPaid ? '✓' : '✗'} · Договор ${i.b.contract ? '✓' : '✗'}${i.b.phone ? '' : ' · <span style="color:var(--err)">нет телефона</span>'}</div>
    </div>`).join('')}</div>
    ${todo.length ? `<button class="btn" id="pvOk">Сохранить (${todo.length})</button>` : '<div class="note">Всё это уже есть в приложении.</div>'}
    <button class="btn btn-light" id="pvBack">Назад</button>`);
  $('pvBack').onclick = pasteSheet;
  if (todo.length) $('pvOk').onclick = () => {
    todo.forEach(i => { if (!i.b.id) i.b.id = newId(); });
    haptic('success'); closeSheet(); commit(todo.map(i => i.b));
  };
}

function editSheet(id, date) {
  const b = id ? bookings.find(x => x.id === id) : { id: '', date: date || todayIso(), from: '', to: '', rent: 0, cleaning: 0, bartender: 0, name: '', phone: '', depositPaid: false, depositSum: 10000, contract: false, note: '' };
  if (!b) return;
  dayOpen = null;
  const f = (k, label, type) => `<div><label>${label}</label><input id="f_${k}" type="${type || 'text'}" value="${esc(b[k] || '')}" ${type === 'number' ? 'inputmode="numeric"' : ''}></div>`;
  openSheet(`<h2>${id ? 'Изменить бронь' : 'Новая бронь'}</h2>
    ${f('date', 'Дата', 'date')}
    <div class="two">${f('from', 'С', 'time')}${f('to', 'До', 'time')}</div>
    <div class="three">${f('rent', 'Аренда', 'number')}${f('cleaning', 'Уборка', 'number')}${f('bartender', 'Бармен', 'number')}</div>
    ${f('name', 'Имя клиента')}
    ${f('phone', 'Телефон', 'tel')}
    ${f('depositSum', 'Сумма залога', 'number')}
    <div class="marks">
      <button class="mark ${b.depositPaid ? 'ok' : ''}" id="eDep">Залог ${b.depositPaid ? '✓' : '✗'}</button>
      <button class="mark ${b.contract ? 'ok' : ''}" id="eCon">Договор ${b.contract ? '✓' : '✗'}</button>
    </div>
    <label>Заметка</label><textarea id="f_note" class="small">${esc(b.note)}</textarea>
    <button class="btn" id="eSave" style="margin-top:14px">Сохранить</button>
    <button class="btn btn-light" id="eCancel">Отмена</button>
    ${id ? '<button class="btn btn-del" id="eDel">Удалить бронь</button>' : ''}`);
  let dep = b.depositPaid, con = b.contract;
  const setM = (el, on, name) => { el.classList.toggle('ok', on); el.textContent = name + (on ? ' ✓' : ' ✗'); };
  $('eDep').onclick = () => { dep = !dep; setM($('eDep'), dep, 'Залог'); };
  $('eCon').onclick = () => { con = !con; setM($('eCon'), con, 'Договор'); };
  $('eCancel').onclick = closeSheet;
  $('eSave').onclick = () => {
    const g = k => $('f_' + k).value.trim();
    if (!g('date')) { haptic('error'); return toast('Укажите дату'); }
    let ph = g('phone').replace(/\D/g, '');
    if (ph.length === 11 && ph[0] === '8') ph = '7' + ph.slice(1);
    if (ph.length === 10) ph = '7' + ph;
    const nb = { id: b.id || newId(), date: g('date'), from: g('from'), to: g('to'),
      rent: +g('rent') || 0, cleaning: +g('cleaning') || 0, bartender: +g('bartender') || 0,
      name: g('name'), phone: ph, depositPaid: dep, depositSum: +g('depositSum') || 0, contract: con, note: g('note') };
    haptic('success'); closeSheet(); commit([nb]);
  };
  if (id) $('eDel').onclick = () => confirmBox('Удалить эту бронь?', ok => { if (ok) { haptic('warning'); closeSheet(); commit(null, id); } });
}

/* ---------- события ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'bg') { closeSheet(); return; }
  const t = e.target.closest('button,a,[data-edit],[data-detail],[data-bar],[data-info]');
  if (!t) return;
  if (t.dataset.tel) { e.preventDefault(); callPhone(t.dataset.tel); return; }
  if (t.dataset.wa) { e.preventDefault(); openWa(t.dataset.wa); return; }
  if (t.dataset.info) infoSheet(t.dataset.info);
  else if (t.dataset.tog) askToggle(t.dataset.id, t.dataset.tog);
  else if (t.dataset.edit) editSheet(t.dataset.edit);
  else if (t.dataset.day) {
    openDay(t.dataset.day);
  }
  else if (t.dataset.add) editSheet(null, t.dataset.add);
  else if (t.dataset.close) closeSheet();
  else if (t.dataset.p) { revPreset = t.dataset.p; render(); const c = document.querySelector(`.chip[data-p="${revPreset}"]`); if (c) c.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }
  else if (t.dataset.bar) pickBar(t.dataset.bar, t.dataset.v);
  else if (t.dataset.detail) { const d = $('dd-' + t.dataset.detail); if (d) d.hidden = !d.hidden; }
  else if (t.id === 'pastBtn') { showPast = !showPast; render(); }
  else if (t.id === 'cPrev') { calStart.setMonth(calStart.getMonth() - 1); render(); }
  else if (t.id === 'cNext') { calStart.setMonth(calStart.getMonth() + 1); render(); }
  else if (t.id === 'fab') addMenu(null);
  else if (t.closest('#tabs') && t.dataset.t) {
    tab = t.dataset.t;
    document.querySelectorAll('#tabs .seg-btn').forEach(x => x.setAttribute('aria-pressed', x === t ? 'true' : 'false'));
    render();
  }
});

/* Нажатие и вибрация срабатывают сразу при касании — и во время прокрутки, когда click не приходит.
   Если палец поехал (прокрутка) — анимация снимается, вибрации нет. */
const PRESS_SEL = 'button,.acts a,[data-edit],[data-detail],[data-info]';
let press = null;
document.addEventListener('touchstart', e => {
  if (press) { press.el.classList.remove('pressed'); press = null; }
  if (e.touches.length !== 1) return;
  const el = e.target.closest && e.target.closest(PRESS_SEL);
  if (!el || el.disabled) return;
  press = { el, x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), moved: false };
  el.classList.add('pressed');
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!press || press.moved) return;
  const tc = e.touches[0];
  if (Math.abs(tc.clientX - press.x) > 10 || Math.abs(tc.clientY - press.y) > 10) { press.moved = true; press.el.classList.remove('pressed'); }
}, { passive: true });
const endPress = e => {
  if (!press) return;
  const p = press; press = null;
  setTimeout(() => p.el.classList.remove('pressed'), Math.max(0, 110 - (Date.now() - p.t)));
  if (e.type === 'touchend' && !p.moved) {
    const soft = p.el.closest('.seg-btn,[data-p],[data-day],[data-bar]');
    haptic(p.el.id === 'fab' ? 'medium' : soft ? 'select' : 'light');
  }
};
document.addEventListener('touchend', endPress, { passive: true });
document.addEventListener('touchcancel', endPress, { passive: true });

loadCache();
render();
refresh(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastFetch > 20000) refresh(true); });
</script>
</body>
